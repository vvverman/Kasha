name: Cleanup prompt acceptance
on:
  push:
    branches: [ai-cleanup-finish]
    paths:
      - tests/cleanup_prompt_acceptance.py
      - .github/workflows/cleanup-prompt-acceptance.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cleanup-prompt-${{ github.ref }}
  cancel-in-progress: false
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        id: native
        with:
          path: desktopApp/bundle/common
          key: kasha-macos-arm64-bundle-${{ hashFiles('desktopApp/packaging/build-native.sh') }}
      - if: steps.native.outputs.cache-hit != 'true'
        run: bash desktopApp/packaging/build-native.sh
      - name: Закреплённая модель, синтетические фразы, внешняя сеть отключена
        run: /usr/bin/sandbox-exec -p '(version 1)(allow default)(deny network*)' python3 tests/cleanup_prompt_acceptance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kasha-cleanup-prompts-${{ github.sha }}
          path: test-output/cleanup-prompt-acceptance
          retention-days: 14
