name: Kasha Desktop Adapters

on:
  pull_request:
    paths:
      - 'modules/infrastructure/jvm/**'
      - 'platforms/desktop/src/**'
      - 'scripts/check-platform-shells.py'
      - 'scripts/prepare-fonts.py'
      - 'docs/design/assets/fonts/**'
      - '.github/workflows/desktop-adapters.yml'
  push:
    branches: [main]
    paths:
      - 'modules/infrastructure/jvm/**'
      - 'platforms/desktop/src/**'
      - 'scripts/check-platform-shells.py'
      - 'scripts/prepare-fonts.py'
      - 'docs/design/assets/fonts/**'
      - '.github/workflows/desktop-adapters.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-adapters-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adapters:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
          - name: windows
            os: windows-2025
          - name: macos
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false
      - name: Architecture boundary
        run: python scripts/check-platform-shells.py
      - name: Prepare canonical fonts
        run: |
          python -m pip install fonttools==4.59.2
          python scripts/prepare-fonts.py
      - name: Desktop adapter tests
        run: gradle :desktopApp:test
