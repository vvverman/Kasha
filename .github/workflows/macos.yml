name: Автономный установщик macOS
on:
  push:
    branches: [macos-installer, main]
    paths:
      - 'kashaCore/**'
      - 'aiCatalog/**'
      - 'composeApp/**'
      - 'runtime/**'
      - 'desktopApp/**'
      - 'scripts/check-platform-shells.py'
      - '.github/workflows/macos.yml'
  pull_request:
    paths:
      - 'kashaCore/**'
      - 'aiCatalog/**'
      - 'composeApp/**'
      - 'runtime/**'
      - 'desktopApp/**'
      - 'scripts/check-platform-shells.py'
      - '.github/workflows/macos.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-installer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Проверка архитектурных границ
        run: |
          python3 scripts/check-brand-boundary.py
          python3 scripts/check-local-only.py
          python3 scripts/check-ai-boundary.py
          python3 scripts/check-ui-boundary.py
          python3 scripts/check-platform-shells.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          architecture: aarch64
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false
      - name: Инструменты только сборочного Mac
        run: |
          uname -a
          df -h .
          command -v cmake || brew install cmake
          command -v ffmpeg || brew install ffmpeg
          command -v rsvg-convert || brew install librsvg
          python3 -m venv .build-python
          .build-python/bin/pip install pillow==11.3.0 piper-tts==1.4.2 fonttools==4.59.2
          .build-python/bin/python scripts/prepare-fonts.py
          .build-python/bin/python desktopApp/packaging/make-icon.py
      - name: Kasha Core, AI catalog, iOS/JVM и все Kotlin-тесты
        run: |
          set -o pipefail
          gradle -Pkotlin.compiler.execution.strategy=in-process \
            :kashaCore:jvmTest \
            :kashaCore:compileKotlinIosArm64 \
            :kashaCore:compileKotlinIosSimulatorArm64 \
            :aiCatalog:jvmTest \
            :aiCatalog:compileKotlinIosArm64 \
            :aiCatalog:compileKotlinIosSimulatorArm64 \
            :composeApp:jvmTest :runtime:test :desktopApp:test :desktopApp:jar 2>&1 | tee macos-compile.log
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: |
            desktopApp/bundle/common
            desktopApp/bundle/macos
          key: kasha-macos-arm64-bundle-${{ hashFiles('desktopApp/packaging/prepare-models.sh', 'desktopApp/packaging/build-native.sh') }}
      - name: Статические движки и исходные модели внутри приложения
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          bash desktopApp/packaging/build-native.sh 2>&1 | tee macos-native.log
      - uses: actions/cache/save@v4
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: |
            desktopApp/bundle/common
            desktopApp/bundle/macos
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Тестовая русская речь
        run: |
          .build-python/bin/python tests/make-russian-fixture.py
          mkdir -p model-test
          cp test-output/real-models/russian-with-pauses.wav model-test/russian.wav
      - name: Самодостаточный .app с Java внутри
        run: |
          gradle -Pkotlin.compiler.execution.strategy=in-process :desktopApp:createDistributable
          gradle --stop
      - name: Запуск без зависимостей и сети, проверка DMG
        run: bash desktopApp/packaging/package-and-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kasha-macos-verification-${{ github.sha }}
          retention-days: 7
          path: |
            macos-compile.log
            macos-native.log
            macos-output/*.json
            macos-output/*.txt
            macos-output/*.log
            macos-output/*.png
            macos-output/self-test/*.json
            macos-output/self-test/*.log
            desktopApp/build/compose/logs
            kashaCore/build/test-results
            aiCatalog/build/test-results
            composeApp/build/test-results
            runtime/build/test-results
            desktopApp/build/test-results
      - uses: actions/upload-artifact@v4
        with:
          name: Kasha-macOS-arm64
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
          path: |
            macos-output/Kasha-*-macOS-arm64.dmg
            macos-output/SHA256SUMS.txt
