name: Kasha iOS SideStore

on:
  pull_request:
    paths:
      - 'kashaCore/**'
      - 'aiCatalog/**'
      - 'composeApp/**'
      - 'iosApp/**'
      - 'scripts/check-ai-boundary.py'
      - 'scripts/check-local-only.py'
      - 'scripts/make-sidestore-source.py'
      - '.github/workflows/ios-sidestore.yml'
  push:
    branches: [main]
    paths:
      - 'kashaCore/**'
      - 'aiCatalog/**'
      - 'composeApp/**'
      - 'iosApp/**'
      - 'scripts/check-ai-boundary.py'
      - 'scripts/check-local-only.py'
      - 'scripts/make-sidestore-source.py'
      - '.github/workflows/ios-sidestore.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Marketing version'
        required: true
        default: '1.2.0'

permissions:
  contents: write

concurrency:
  group: kasha-ios-sidestore-${{ github.ref }}
  cancel-in-progress: true

env:
  IOS_VERSION: ${{ github.event.inputs.version || '1.2.0' }}
  IOS_PRODUCT_NAME: 'Kasha Test'
  IOS_BUNDLE_IDENTIFIER: 'ru.vrmn.kasha.test'

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      - uses: actions/cache@v4
        id: native
        with:
          path: iosApp/build/native/iphoneos
          key: kasha-ios-native-device-v1-${{ hashFiles('iosApp/native/**') }}

      - name: Build bundled iPhone model runtimes
        if: steps.native.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          bash iosApp/native/build.sh iphoneos 2>&1 | tee ios-native-device.log

      - name: Prepare Kasha resources and boundaries
        run: |
          python -m pip install fonttools==4.59.2
          python scripts/prepare-fonts.py
          python scripts/check-ui-boundary.py
          python scripts/check-local-only.py
          python scripts/check-ai-boundary.py

      - name: Build shared Kasha framework for iPhone
        run: |
          set -o pipefail
          gradle :composeApp:linkReleaseFrameworkIosArm64 2>&1 | tee ios-framework.log
          test -d composeApp/build/bin/iosArm64/releaseFramework/KashaShared.framework

      - name: Install deterministic project/icon tools
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          command -v rsvg-convert >/dev/null || brew install librsvg

      - name: Generate Kasha app icons
        run: |
          set -euo pipefail
          ICON_DIR="iosApp/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICON_DIR" build/ios
          for size in 40 58 60 80 87 120 180 1024; do
            rsvg-convert -w "$size" -h "$size" iosApp/KashaAppIcon.svg -o "$ICON_DIR/icon-$size.png"
          done
          cp "$ICON_DIR/icon-120.png" "$ICON_DIR/icon-120-60.png"
          cp "$ICON_DIR/icon-1024.png" build/ios/Kasha-icon.png

      - name: Generate Xcode project
        run: xcodegen generate --spec iosApp/project.yml

      - name: Archive unsigned iPhone app
        run: |
          set -o pipefail
          xcodebuild \
            -project iosApp/Kasha.xcodeproj \
            -scheme Kasha \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/ios/Kasha.xcarchive" \
            -derivedDataPath "$PWD/build/ios/DerivedData" \
            PRODUCT_NAME="$IOS_PRODUCT_NAME" \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_IDENTIFIER" \
            MARKETING_VERSION="$IOS_VERSION" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            SKIP_INSTALL=NO \
            clean archive 2>&1 | tee ios-app.log

      - name: Package unsigned IPA for SideStore
        run: |
          set -euo pipefail
          APP="build/ios/Kasha.xcarchive/Products/Applications/$IOS_PRODUCT_NAME.app"
          test -d "$APP"
          for engine in Whisper Llama; do
            LIB="$APP/Frameworks/Kasha$engine.framework/Kasha$engine"
            test -f "$LIB"
            lipo -verify_arch arm64 "$LIB"
            nm -gU "$LIB" | grep -q "_kasha_$(echo "$engine" | tr '[:upper:]' '[:lower:]')_run$"
          done
          rm -rf build/ios/Payload
          rm -f build/ios/Kasha.ipa
          mkdir -p build/ios/Payload
          ditto "$APP" "build/ios/Payload/$IOS_PRODUCT_NAME.app"
          (cd build/ios && zip -qry Kasha.ipa Payload)

      - name: Generate SideStore source
        run: |
          python scripts/make-sidestore-source.py \
            --ipa build/ios/Kasha.ipa \
            --version "$IOS_VERSION" \
            --build "${GITHUB_RUN_NUMBER}" \
            --output build/ios/source.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Kasha-iOS-SideStore-${{ github.run_number }}
          retention-days: 14
          path: |
            build/ios/Kasha.ipa
            build/ios/source.json
            build/ios/Kasha-icon.png
            ios-framework.log
            ios-app.log
            ios-native-device.log

      - name: Publish rolling SideStore release
        if: success() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view sidestore-latest >/dev/null 2>&1; then
            gh release create sidestore-latest \
              --target "$GITHUB_SHA" \
              --title 'Kasha Test · SideStore' \
              --notes 'Rolling unsigned iOS build for SideStore. SideStore signs it locally with the user Apple Account.'
          fi
          gh release upload sidestore-latest \
            build/ios/Kasha.ipa#Kasha.ipa \
            build/ios/source.json#source.json \
            build/ios/Kasha-icon.png#Kasha-icon.png \
            --clobber

      - name: Print install links
        if: success() && github.event_name != 'pull_request'
        run: |
          echo 'Source: https://github.com/vvverman/Kasha/releases/download/sidestore-latest/source.json'
          echo 'SideStore source URL: sidestore://source?url=https%3A%2F%2Fgithub.com%2Fvvverman%2FKasha%2Freleases%2Fdownload%2Fsidestore-latest%2Fsource.json'
          echo 'Direct IPA: https://github.com/vvverman/Kasha/releases/download/sidestore-latest/Kasha.ipa'
