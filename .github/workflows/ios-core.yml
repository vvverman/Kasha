name: Kasha iOS Shared

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kasha-ios-shared-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-shared:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false
      - uses: actions/cache@v4
        id: native
        with:
          path: iosApp/build/native/iphonesimulator
          key: kasha-ios-native-simulator-v1-${{ hashFiles('iosApp/native/**') }}
      - name: Build pinned iOS native model runtimes
        if: steps.native.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          bash iosApp/native/build.sh iphonesimulator 2>&1 | tee ios-native.log
      - uses: actions/cache@v4
        with:
          path: desktopApp/bundle/common/models
          key: kasha-ios-model-fixtures-v1-${{ hashFiles('desktopApp/packaging/prepare-models.sh') }}
      - name: Prepare pinned models and actual speech fixture
        run: |
          set -euo pipefail
          bash desktopApp/packaging/prepare-models.sh
          command -v ffmpeg >/dev/null || brew install ffmpeg
          python3 -m venv .ios-test-python
          .ios-test-python/bin/pip install fonttools==4.59.2 piper-tts==1.4.2
          .ios-test-python/bin/python tests/make-russian-fixture.py
          ffmpeg -nostdin -v error -y -i test-output/real-models/russian-with-pauses.wav -ar 48000 -ac 1 test-output/real-models/russian-48k.m4a
          .ios-test-python/bin/python scripts/prepare-fonts.py
      - name: Аудиоустройства и полностью загруженный iPhone
        run: |
          set -euo pipefail
          system_profiler SPAudioDataType > ios-audio-host.txt
          python3 - <<'PYBOOT'
          import json, os, subprocess
          from pathlib import Path
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))
          candidates = [device for runtime, group in devices['devices'].items() if '.iOS-' in runtime
                        for device in group if device.get('isAvailable') and device['name'].startswith('iPhone')]
          assert candidates, 'Нет доступного симулятора iPhone'
          selected = next((d for d in candidates if d.get('state') == 'Booted'), candidates[-1])
          device = selected['udid']
          if selected.get('state') != 'Booted':
              subprocess.run(['xcrun', 'simctl', 'boot', device], check=True, timeout=90)
          subprocess.run(['xcrun', 'simctl', 'bootstatus', device, '-b'], check=True, timeout=180)
          subprocess.run(['open', '-a', 'Simulator', '--args', '-CurrentDeviceUDID', device], check=True)
          Path('ios-test-device.json').write_text(json.dumps(selected, indent=2))
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('KASHA_IOS_TEST_DEVICE=' + device + '\n')
          print('Все Kotlin iOS-тесты используют загруженный iPhone:', device)
          PYBOOT
      - name: Compile and test Kasha shared iOS layer
        run: |
          set -o pipefail
          export SIMCTL_CHILD_KASHA_IOS_NATIVE_FRAMEWORKS="$PWD/iosApp/build/native/iphonesimulator"
          export SIMCTL_CHILD_KASHA_IOS_MODEL_FIXTURES="$PWD/desktopApp/bundle/common/models"
          export SIMCTL_CHILD_KASHA_IOS_AUDIO_FIXTURE="$PWD/test-output/real-models/russian-with-pauses.wav"
          export SIMCTL_CHILD_KASHA_IOS_AI_EVIDENCE="$PWD/test-output/ios-local-models"
          export SIMCTL_CHILD_KASHA_IOS_VISUAL_EVIDENCE="$PWD/test-output/ios-visual"
          gradle \
            :kashaCore:compileKotlinIosArm64 \
            :kashaCore:compileKotlinIosSimulatorArm64 \
            :kashaCore:iosSimulatorArm64Test \
            :aiCatalog:compileKotlinIosArm64 \
            :aiCatalog:compileKotlinIosSimulatorArm64 \
            :aiCatalog:iosSimulatorArm64Test \
            :composeApp:compileKotlinIosArm64 \
            :composeApp:compileKotlinIosSimulatorArm64 \
            :composeApp:compileTestKotlinIosArm64 \
            :composeApp:iosSimulatorArm64Test \
            2>&1 | tee ios-shared.log
          test -s test-output/ios-local-models/ios-local-models.json
          python3 - <<'PYAI'
          import json
          from pathlib import Path
          evidence = json.loads(Path('test-output/ios-local-models/ios-local-models.json').read_text())
          for flag in ('passed', 'nativeWhisper', 'pcm16kAndAac48k', 'nativeQwen', 'sourceUnchanged'):
              assert evidence.get(flag) is True, flag
          assert evidence.get('routerRoles') == 3
          assert evidence.get('networkTransport') is False
          print('iOS local AI acceptance evidence: PASS')
          PYAI
          test -s test-output/ios-visual/result.json
      - name: Системная диагностика аудио симулятора
        if: failure()
        run: |
          python3 - <<'PYDIAG'
          import json, subprocess
          from pathlib import Path
          devices = json.loads(subprocess.check_output(['xcrun','simctl','list','devices','booted','-j']))
          for group in devices['devices'].values():
              for device in group:
                  if device.get('state') != 'Booted':
                      continue
                  try:
                      result = subprocess.run(['xcrun','simctl','spawn', device['udid'], 'log', 'show',
                          '--last','10m','--style','compact','--predicate',
                          'subsystem CONTAINS[c] "audio" OR eventMessage CONTAINS[c] "AudioQueue"'],
                          capture_output=True, text=True, timeout=30)
                      Path('ios-audio-system-' + device['udid'] + '.log').write_text(
                          (result.stdout + result.stderr)[-250000:])
                  except Exception as error:
                      print('Audio diagnostics unavailable:', error)
          PYDIAG
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kasha-ios-shared-${{ github.sha }}
          retention-days: 14
          path: |
            ios-shared.log
            ios-audio-host.txt
            ios-test-device.json
            ios-audio-system-*.log
            ios-native.log
            test-output/ios-local-models/
            test-output/ios-visual/
            kashaCore/build/test-results/
            aiCatalog/build/test-results/
            composeApp/build/test-results/
