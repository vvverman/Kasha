name: Kasha Desktop Windows Linux

on:
  pull_request:
    paths:
      - 'kashaCore/**'
      - 'aiCatalog/**'
      - 'composeApp/**'
      - 'runtime/**'
      - 'desktopApp/**'
      - 'scripts/check-platform-shells.py'
      - '.github/workflows/desktop-platforms.yml'
  push:
    branches: [main]
    paths:
      - 'kashaCore/**'
      - 'aiCatalog/**'
      - 'composeApp/**'
      - 'runtime/**'
      - 'desktopApp/**'
      - 'scripts/check-platform-shells.py'
      - '.github/workflows/desktop-platforms.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false
      - name: Architecture boundary
        run: |
          python3 scripts/check-ai-boundary.py
          python3 scripts/check-platform-shells.py
      - name: Linux build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential cmake ninja-build curl git file rpm fakeroot
      - uses: actions/cache@v4
        id: linux-native
        with:
          path: |
            desktopApp/bundle/common
            desktopApp/bundle/linux
          key: kasha-linux-x64-native-${{ hashFiles('desktopApp/packaging/prepare-models.sh', 'desktopApp/packaging/build-native-linux.sh') }}
      - name: Native AI engines and models
        if: steps.linux-native.outputs.cache-hit != 'true'
        run: bash desktopApp/packaging/build-native-linux.sh
      - name: Tests and Linux packages
        run: |
          python3 -m pip install fonttools==4.59.2
          python3 scripts/prepare-fonts.py
          gradle :kashaCore:jvmTest :aiCatalog:jvmTest :composeApp:jvmTest :runtime:test :desktopApp:test
          gradle :desktopApp:packageDistributionForCurrentOS
      - name: Verify packaged native resources
        run: |
          test -x desktopApp/bundle/linux/bin/whisper-cli
          test -x desktopApp/bundle/linux/bin/llama-completion
          test -x desktopApp/bundle/linux/bin/ffmpeg
          test -s desktopApp/bundle/common/models/ggml-small.bin
          test -s desktopApp/bundle/common/models/Qwen3-4B-Q4_K_M.gguf
          find desktopApp/build/compose/binaries/main -type f \( -name '*.deb' -o -name '*.rpm' \) -print | tee linux-packages.txt
          test "$(wc -l < linux-packages.txt)" -ge 2
      - uses: actions/upload-artifact@v4
        with:
          name: Kasha-Linux-x64
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
          path: |
            desktopApp/build/compose/binaries/main/**/*.deb
            desktopApp/build/compose/binaries/main/**/*.rpm
            linux-packages.txt

  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false
      - name: Architecture boundary
        shell: pwsh
        run: |
          python scripts/check-ai-boundary.py
          python scripts/check-platform-shells.py
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            curl
            make
            gzip
            tar
            file
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - uses: actions/cache@v4
        id: windows-native
        with:
          path: |
            desktopApp/bundle/common
            desktopApp/bundle/windows
          key: kasha-windows-x64-native-${{ hashFiles('desktopApp/packaging/prepare-models.sh', 'desktopApp/packaging/build-native-windows.sh') }}
      - name: Native AI engines and models
        if: steps.windows-native.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash desktopApp/packaging/build-native-windows.sh
      - name: Tests and Windows packages
        shell: pwsh
        run: |
          python -m pip install fonttools==4.59.2
          python scripts/prepare-fonts.py
          gradle :kashaCore:jvmTest :aiCatalog:jvmTest :composeApp:jvmTest :runtime:test :desktopApp:test
          gradle :desktopApp:packageDistributionForCurrentOS
      - name: Verify packaged native resources
        shell: pwsh
        run: |
          if (!(Test-Path desktopApp/bundle/windows/bin/whisper-cli.exe)) { throw 'whisper-cli.exe missing' }
          if (!(Test-Path desktopApp/bundle/windows/bin/llama-completion.exe)) { throw 'llama-completion.exe missing' }
          if (!(Test-Path desktopApp/bundle/windows/bin/ffmpeg.exe)) { throw 'ffmpeg.exe missing' }
          $files = Get-ChildItem desktopApp/build/compose/binaries/main -Recurse -File | Where-Object { $_.Extension -in '.msi','.exe' }
          $files | ForEach-Object { $_.FullName } | Set-Content windows-packages.txt
          if ($files.Count -lt 2) { throw 'Windows MSI/EXE packages missing' }
      - uses: actions/upload-artifact@v4
        with:
          name: Kasha-Windows-x64
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
          path: |
            desktopApp/build/compose/binaries/main/**/*.msi
            desktopApp/build/compose/binaries/main/**/*.exe
            windows-packages.txt
