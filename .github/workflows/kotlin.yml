name: Kotlin Multiplatform
on:
  push:
    branches: [studio-test, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kotlin-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Исходники проверяемой ревизии
        run: git archive --format=zip --output=verification-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: kasha-verification-source-${{ github.sha }}
          retention-days: 3
          path: verification-source.zip
      - name: Проверка бренда, local-first и AI privacy границ
        run: |
          python3 scripts/check-brand-boundary.py
          python3 scripts/check-local-only.py
          python3 scripts/check-ai-boundary.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false
      - name: Сборочные ресурсы и граница Kasha UI
        run: |
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
          python -m pip install fonttools==4.59.2 playwright==1.55.0
          python scripts/prepare-fonts.py
          python scripts/check-ui-boundary.py
          bash -n run-web.sh scripts/gradle.sh
      - name: Контракты Web-плеера и IndexedDB без ожидания сборки
        run: |
          set -o pipefail
          node --test tests/web_playback_contract.test.cjs tests/web_storage_contract.test.cjs 2>&1 | tee web-playback-contract.tap
      - name: Kasha Core, AI catalog и общий UI на JVM/Android; runtime и production WebAssembly
        run: |
          set -o pipefail
          gradle --continue \
            :kashaCore:assemble :kashaCore:jvmTest :kashaCore:compileKotlinMetadata \
            :aiCatalog:assemble :aiCatalog:jvmTest :aiCatalog:compileKotlinMetadata \
            :composeApp:assemble :composeApp:jvmTest \
            :runtime:test :desktopApp:test \
            :composeApp:wasmJsBrowserDistribution :runtime:installDist \
            2>&1 | tee kotlin.log
      - name: Обязательная non-AI приёмка в браузере
        id: browser_non_ai
        run: |
          export KASHA_HOME=$(mktemp -d)
          printf 'KASHA_BROWSER_HOME=%s\n' "$KASHA_HOME" >> "$GITHUB_ENV"
          export KASHA_DEMO_AI=1
          export KASHA_WEB_ROOT="$PWD/composeApp/build/dist/wasmJs/productionExecutable"
          bash runtime/build/install/runtime/bin/runtime > runtime.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          python tests/web_storage_retry_browser.py
          python tests/web_recorder_identity_browser.py
          python tests/web_adapter_browser.py
          python tests/studio_browser.py
          python tests/sorting_browser.py
          python tests/responsive_accessibility_browser.py
          python tests/non_ai_parity_browser.py
          echo 'Non-AI browser acceptance: PASS' >> "$GITHUB_STEP_SUMMARY"
      # Раздел 6 отложен владельцем. Сценарий выполняется и сохраняет ошибку,
      # но не подменяет результат обязательной функциональной приёмки.
      - name: 'DEFERRED: section 6 — AI readiness'
        id: browser_ai_deferred
        continue-on-error: true
        run: |
          export KASHA_HOME="$KASHA_BROWSER_HOME"
          export KASHA_DEMO_AI=1
          export KASHA_WEB_ROOT="$PWD/composeApp/build/dist/wasmJs/productionExecutable"
          bash runtime/build/install/runtime/bin/runtime >> runtime.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          python tests/ai_readiness_browser.py
      - name: Отдельный статус отложенного AI-сценария
        if: always()
        env:
          AI_OUTCOME: ${{ steps.browser_ai_deferred.outcome }}
        run: |
          printf 'DEFERRED: section 6 — AI readiness outcome: %s. AI acceptance remains open.\n' "$AI_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kasha-web-verification-${{ github.sha }}
          retention-days: 14
          path: |
            kotlin.log
            runtime.log
            web-playback-contract.tap
            test-output/storage-retry
            test-output/browser-adapter
            test-output/studio
            test-output/sorting
            test-output/responsive
            test-output/ai-readiness
            test-output/non-ai-parity
            kashaCore/build/test-results
            aiCatalog/build/test-results
            composeApp/build/test-results
            runtime/build/test-results
            desktopApp/build/test-results
            composeApp/build/dist/wasmJs/productionExecutable
            runtime/build/install
