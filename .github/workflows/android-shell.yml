name: Android shell verification
on:
  push:
    branches: [main, platform/android-production, platform/android-recorder-contract, platform/android-main-integration]
    paths:
      - 'androidApp/**'
      - 'composeApp/**'
      - 'kashaCore/**'
      - 'aiCatalog/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/android-shell.yml'
  pull_request:
    paths:
      - 'androidApp/**'
      - 'composeApp/**'
      - 'kashaCore/**'
      - 'aiCatalog/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/android-shell.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-shell-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Prepare shared fonts
        run: |
          python -m pip install fonttools==4.59.2
          python scripts/prepare-fonts.py
      - name: Android adapter tests, APK and AAB
        run: |
          set -o pipefail
          gradle :androidApp:testDebugUnitTest :androidApp:assembleDebug :androidApp:assembleRelease :androidApp:bundleRelease 2>&1 | tee android-build.log
          printf 'Commit: %s\nRelease signing: unsigned in CI\n' "$GITHUB_SHA" > android-artifact-info.txt
      - name: Verify packaged local AI libraries
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import struct

          outputs = Path('androidApp/build/outputs')
          groups = {
              'Debug APK': list((outputs / 'apk/debug').glob('*.apk')),
              'Release APK': list((outputs / 'apk/release').glob('*.apk')),
              'Release AAB': list((outputs / 'bundle/release').glob('*.aab')),
          }
          machines = {'armeabi-v7a': 40, 'arm64-v8a': 183, 'x86': 3, 'x86_64': 62}
          for kind, packages in groups.items():
              assert packages, f'{kind} was not produced'
              for package in packages:
                  prefix = 'base/lib' if package.suffix == '.aab' else 'lib'
                  with ZipFile(package) as archive:
                      files = set(archive.namelist())
                      for abi, machine in machines.items():
                          for library in ('libkasha_whisper.so', 'libkasha_llama.so', 'libc++_shared.so'):
                              entry = f'{prefix}/{abi}/{library}'
                              assert entry in files, f'Missing native dependency: {package} / {entry}'
                              data = archive.read(entry)
                              assert data[:4] == b'\x7fELF' and data[5] == 1, f'Invalid ELF: {entry}'
                              assert struct.unpack_from('<H', data, 18)[0] == machine, f'Wrong ABI: {entry}'
                          print(package, abi, 'Whisper + llama.cpp + C++ runtime packaged')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-shell-log-${{ github.sha }}
          retention-days: 14
          path: android-build.log
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Kasha-android-debug-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            androidApp/build/outputs/apk/debug/*.apk
            android-artifact-info.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Kasha-android-release-unsigned-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            androidApp/build/outputs/apk/release/*.apk
            androidApp/build/outputs/bundle/release/*.aab
            android-artifact-info.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Kasha-android-test-reports-${{ github.sha }}
          retention-days: 14
          path: |
            androidApp/build/reports/tests/
            androidApp/build/test-results/
