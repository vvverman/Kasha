name: Android shell verification
on:
  pull_request:
    paths:
      - 'androidApp/**'
      - 'composeApp/**'
      - 'kashaCore/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/android-shell.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Prepare shared fonts
        run: |
          python -m pip install fonttools==4.59.2
          python scripts/prepare-fonts.py
      - name: Test Android persistence and assemble debug shell
        run: |
          set -o pipefail
          gradle :androidApp:testDebugUnitTest :androidApp:assembleDebug 2>&1 | tee android-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-shell-log-${{ github.sha }}
          retention-days: 14
          path: android-build.log
