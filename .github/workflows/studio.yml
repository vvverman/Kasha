name: Kasha Test — интерфейс без нейросетей
on:
  push:
    branches: [studio-test, preview/macos-no-ai-20260921]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: studio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Проверка границ Kasha
        run: |
          python3 scripts/check-brand-boundary.py
          python3 scripts/check-local-only.py
      - run: git archive --format=zip --output=source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: kasha-source-${{ github.sha }}
          path: source.zip
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          architecture: aarch64
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false
      - name: Ресурсы дизайна и граница Kasha UI
        run: |
          command -v ffmpeg || brew install ffmpeg
          command -v rsvg-convert || brew install librsvg
          python3 -m venv .studio-python
          .studio-python/bin/pip install pillow==11.3.0 fonttools==4.59.2
          .studio-python/bin/python scripts/prepare-fonts.py
          .studio-python/bin/python scripts/check-ui-boundary.py
          .studio-python/bin/python desktopApp/packaging/make-icon.py
      - name: Kasha Core, общий UI и macOS
        run: |
          set -o pipefail
          gradle -PdemoBuild=true -Pkotlin.compiler.execution.strategy=in-process \
            :kashaCore:jvmTest :aiCatalog:jvmTest :composeApp:jvmTest \
            :runtime:test :desktopApp:test :desktopApp:jar 2>&1 | tee studio-compile.log
      - uses: actions/cache/restore@v4
        id: audio-cache
        with:
          path: desktopApp/bundle-test/common
          key: kasha-ffmpeg-arm64-${{ hashFiles('desktopApp/packaging/build-test-native.sh') }}
      - name: Только аудиодвижок, без моделей
        if: steps.audio-cache.outputs.cache-hit != 'true'
        run: bash desktopApp/packaging/build-test-native.sh
      - uses: actions/cache/save@v4
        if: steps.audio-cache.outputs.cache-hit != 'true'
        with:
          path: desktopApp/bundle-test/common
          key: ${{ steps.audio-cache.outputs.cache-primary-key }}
      - name: Автономное приложение
        run: |
          gradle -PdemoBuild=true -Pkotlin.compiler.execution.strategy=in-process :desktopApp:createDistributable
          gradle --stop
      - name: Самопроверка без сети, экраны, DMG
        run: bash desktopApp/packaging/package-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kasha-verification-${{ github.sha }}
          path: |
            studio-compile.log
            studio-output/*.log
            studio-output/*.json
            studio-output/screens
            studio-output/self-test/*.json
            studio-output/self-test/*.log
            kashaCore/build/test-results
            composeApp/build/test-results
            runtime/build/test-results
            desktopApp/build/test-results
            desktopApp/build/compose/logs
      - uses: actions/upload-artifact@v4
        with:
          name: Kasha-Test-macOS-arm64
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
          path: |
            studio-output/Kasha-Test-*-macOS-arm64.dmg
            studio-output/SHA256SUMS.txt
            studio-output/BUILD-REPORT.json
