name: Kasha
options:
  bundleIdPrefix: ru.vrmn
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: "NO"

schemes:
  Kasha:
    build:
      targets:
        Kasha: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  Kasha:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
      - path: Assets.xcassets
        buildPhase: resources
    preBuildScripts:
      - name: Ресурсы Kasha UI
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          export JAVA_HOME="${JAVA_HOME:-$(/usr/libexec/java_home -v 21)}"
          cd "$SRCROOT/.."
          gradle :composeApp:syncComposeResourcesForIos
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.vrmn.kasha
        PRODUCT_NAME: Kasha
        MARKETING_VERSION: 1.2.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - framework: ../composeApp/build/bin/iosArm64/releaseFramework/KashaShared.framework
        embed: false
      - framework: build/native/iphoneos/KashaWhisper.framework
        embed: true
      - framework: build/native/iphoneos/KashaLlama.framework
        embed: true
